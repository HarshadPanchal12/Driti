name: Build Android Debug APK

on:
  push:
    branches: [ "main" ] # Change to your default branch name if it's different (e.g., master)
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x android-agent/gradlew

    - name: Build Debug APK
      run: |
        cd android-agent
        ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: drishti-debug-apk
        path: android-agent/app/build/outputs/apk/debug/app-debug.apk
